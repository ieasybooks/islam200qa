name: Release please

# On each push to main, release-please keeps a release pull request open with
# the app's next version (pubspec.yaml) and changelog, from the Conventional
# Commits since its last release. Merging it tags the app (v<version>) and
# creates its GitHub release. This workflow then runs every check (check.yml)
# on the commit it tagged, or on the pushed commit when it tagged nothing,
# marks the commit with a "Checks" status saying how they ended, and once they
# passed releases the app to Google Play and AppGallery (release.yml) when it
# tagged it. The release builds exactly that commit. See docs/releasing.md.
#
# The website, islam200qa.ieasybooks.com, isn't released here: Netlify builds
# and hosts it.
#
# Tags made with GITHUB_TOKEN start no workflows, so this workflow calls the
# release workflow itself, and its jobs run as this workflow on main. The vault
# knows them by this file's name and serves them the release secrets only in
# runs Ali (AliOsm) started. When someone else pushes, the checks still run and
# nothing ships; a note says so. Re-running doesn't help, as a re-run keeps the
# pusher's identity: Ali runs Release app (dry-run unticked) on the v tag
# instead.
#
# Run by hand with access-check ticked, it releases nothing and only checks
# that the vault gives release.yml's jobs their own secrets and refuses them
# other apps' keys and deploy tokens.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      access-check:
        description: Only check the vault's rules for the release workflow; release nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release please
    if: github.ref == 'refs/heads/main' && !inputs.access-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      app: ${{ steps.release.outputs.release_created }}
      app-tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
      # What the checks run on and the release jobs ship: the commit
      # release-please tagged, which may not be the pushed one when pushes
      # queue up, or the pushed commit when it tagged nothing.
      - name: Pick the commit to check
        id: commit
        env:
          APP_SHA: ${{ steps.release.outputs.sha }}
        run: |
          sha=${APP_SHA:-$GITHUB_SHA}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Checking $sha."

  # The checks GitHub starts on GITHUB_TOKEN's pull requests wait for someone
  # to approve them, and the release pull request needs none: its merge is
  # checked on main before anything ships. So this job checks that the version
  # it brings can be released (its store release notes), as the "Release
  # check" status.
  release-pr:
    name: Release pull request
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please-pr
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the release pull request
        id: pr
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json number,headRefName --jq '.[0] // empty | "number=\(.number)\nbranch=\(.headRefName)"' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.number
        with:
          ref: ${{ steps.pr.outputs.branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.pr.outputs.number
        with:
          bun-version: 1.4.4
      # The release check comes from ieasybooks/release, pinned in bun.lock;
      # nothing else is needed, so no lifecycle scripts run.
      - name: Install the release tool
        if: steps.pr.outputs.number
        run: bun install --frozen-lockfile --ignore-scripts
      # Against main as the merge will be: main's store folder, with the
      # pull request's version.
      - name: Check the app can be released
        if: steps.pr.outputs.number
        run: |
          head=$(git rev-parse HEAD)
          git fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet "$GITHUB_SHA"
          released=$(sed -n 's/^version: *//p' pubspec.yaml)
          git checkout --quiet "$head" -- pubspec.yaml
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [ "$version" = "$released" ]; then
            state=success
            description="This release leaves the app at $version."
            echo "$description" > check.log
          elif ./node_modules/.bin/ieasybooks-release store check --app . > check.log 2>&1; then
            state=success
            description=$(tail -1 check.log)
          else
            state=failure
            description=$(sed -n 2p check.log | sed 's/^ *- //')
          fi
          cat check.log
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head" \
            -f state="$state" -f context="Release check" \
            -f description="${description:0:140}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

  # Every check, on the commit the release jobs would ship.
  check:
    name: Check
    needs: release-please
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      sha: ${{ needs.release-please.outputs.sha }}

  # Marks the commit with how its checks ended, as its "Checks" status, which
  # a release from a tag pushed by hand needs (ieasybooks-release
  # verify-commit). It runs however they ended, also on a re-run, so a later
  # run whose checks failed or was cancelled takes an earlier success back.
  checks-status:
    name: Mark the commit's checks
    needs: [release-please, check]
    if: ${{ always() && needs.release-please.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.release-please.outputs.sha }}
          RESULT: ${{ needs.check.result }}
        run: |
          case $RESULT in
            success) state=success description="Every check passed on main." ;;
            failure) state=failure description="A check failed on main." ;;
            *) state=error description="Main's checks didn't finish ($RESULT)." ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context=Checks \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "Marked $SHA: $description"
      - name: Note that nothing ships
        if: needs.check.result == 'success' && needs.release-please.outputs.app == 'true' && github.actor != 'AliOsm'
        env:
          ACTOR: ${{ github.actor }}
          TAG: ${{ needs.release-please.outputs.app-tag }}
        run: |
          echo "::notice::$ACTOR started this run, so it doesn't release $TAG: the vault serves the release secrets only in runs AliOsm started. AliOsm can run Release app on $TAG with dry-run unticked."

  app:
    name: Release app
    needs: [release-please, check]
    if: needs.release-please.outputs.app == 'true' && github.actor == 'AliOsm'
    permissions:
      contents: read
      id-token: write
      statuses: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.app-tag }}
      sha: ${{ needs.release-please.outputs.sha }}

  # The vault access check, run by hand on main (see the top).
  access-check:
    name: Vault access check
    if: github.ref == 'refs/heads/main' && inputs.access-check
    permissions:
      contents: read
      id-token: write
      statuses: read
    uses: ./.github/workflows/release.yml
    with:
      access-check: true
