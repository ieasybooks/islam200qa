name: Release please

# On each push to main, release-please keeps a release pull request open with
# the app's next version (pubspec.yaml) and changelog, from the Conventional
# Commits since its last release. Merging it tags the app (v<version>) and
# creates its GitHub release. This workflow runs every check (check.yml) on
# the pushed commit, marks it with a "Checks" status saying how they ended,
# and once they passed deploys it to islam200qa.ieasybooks.com (web.yml).
# When release-please tags the app, it releases it to Google Play and
# AppGallery (release.yml) from the commit it tagged, once that commit's
# checks passed: the pushed one, or an earlier one when the run for the
# release pull request's merge tagged nothing (it failed, say) and this run
# tagged it, which then gets its own checks and status.
#
# Each builds exactly its commit. See docs/releasing.md and
# docs/web-deployment.md.
#
# Tags made with GITHUB_TOKEN start no workflows, so this workflow calls the
# release workflows itself, and their jobs run as this workflow on main. The
# vault knows them by this file's name and serves each its own secrets only in
# runs Ali (AliOsm) started. When someone else pushes, the checks still run and
# nothing ships; a note says so. Re-running doesn't help, as a re-run keeps the
# pusher's identity: Ali runs Release web on main, and Release app (dry-run
# unticked) on the v tag, instead.
#
# Run by hand with access-check ticked, it releases nothing and only checks
# that the vault gives release.yml's and web.yml's jobs their own secrets and
# refuses them each other's and other apps' keys and deploy tokens.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      access-check:
        description: Only check the vault's rules for the release workflows; release nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release please
    if: github.ref == 'refs/heads/main' && !inputs.access-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time, each in turn: queue: max keeps up to 100 waiting,
    # where GitHub would cancel all but the newest, and a run cancelled
    # before release-please tags the release pull request's merge leaves the
    # tag to a later push's run.
    concurrency:
      group: release-please
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      app: ${{ steps.release.outputs.release_created }}
      app-tag: ${{ steps.release.outputs.tag_name }}
      app-sha: ${{ steps.app.outputs.sha }}
      app-apart: ${{ steps.app.outputs.apart }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
      # The commit the app release ships: the one release-please tagged,
      # which is an earlier one than the pushed commit when this run tagged a
      # release pull request's merge that an earlier run didn't.
      - name: Pick the app's commit
        id: app
        if: steps.release.outputs.release_created == 'true'
        env:
          APP_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if ! [[ $APP_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release-please tagged the app without a full commit SHA ($APP_SHA)."
            exit 1
          fi
          echo "sha=$APP_SHA" >> "$GITHUB_OUTPUT"
          if [ "$APP_SHA" = "$GITHUB_SHA" ]; then
            echo "apart=false" >> "$GITHUB_OUTPUT"
            echo "The app releases from the pushed commit, $APP_SHA."
          else
            echo "apart=true" >> "$GITHUB_OUTPUT"
            echo "The app releases from $APP_SHA, which release-please tagged; the site deploys the pushed $GITHUB_SHA."
          fi

  # The checks GitHub starts on GITHUB_TOKEN's pull requests wait for someone
  # to approve them, and the release pull request needs none: its merge is
  # checked on main before anything ships. So this job checks that the version
  # it brings can be released (its store release notes), as the "Release
  # check" status.
  release-pr:
    name: Release pull request
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please-pr
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the release pull request
        id: pr
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json number,headRefName --jq '.[0] // empty | "number=\(.number)\nbranch=\(.headRefName)"' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.number
        with:
          ref: ${{ steps.pr.outputs.branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.pr.outputs.number
        with:
          bun-version: 1.4.4
      # The release check comes from ieasybooks/release, pinned in bun.lock;
      # nothing else is needed, so no lifecycle scripts run.
      - name: Install the release tool
        if: steps.pr.outputs.number
        run: bun install --frozen-lockfile --ignore-scripts
      # Against main as the merge will be: main's store folder, with the
      # pull request's version.
      - name: Check the app can be released
        if: steps.pr.outputs.number
        run: |
          head=$(git rev-parse HEAD)
          git fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet "$GITHUB_SHA"
          released=$(sed -n 's/^version: *//p' pubspec.yaml)
          git checkout --quiet "$head" -- pubspec.yaml
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [ "$version" = "$released" ]; then
            state=success
            description="This release leaves the app at $version."
            echo "$description" > check.log
          elif ./node_modules/.bin/ieasybooks-release store check --app . > check.log 2>&1; then
            state=success
            description=$(tail -1 check.log)
          else
            state=failure
            description=$(sed -n 2p check.log | sed 's/^ *- //')
          fi
          cat check.log
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head" \
            -f state="$state" -f context="Release check" \
            -f description="${description:0:140}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

  # Every check, on the pushed commit, which the site deploys. It doesn't
  # wait for release-please, so a push is checked and deployed even when
  # release-please fails.
  check:
    name: Check
    if: github.ref == 'refs/heads/main' && !inputs.access-check
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      sha: ${{ github.sha }}

  # Every check on the app's commit, when release-please tagged an earlier
  # commit than the pushed one.
  app-check:
    name: Check the app's commit
    needs: release-please
    if: needs.release-please.outputs.app-apart == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      sha: ${{ needs.release-please.outputs.app-sha }}

  # Marks each checked commit with how its checks ended, as its "Checks"
  # status, which Release web run by hand and a release from a tag pushed by
  # hand need (ieasybooks-release verify-commit). It runs however they ended,
  # also on a re-run, so a later run whose checks failed or was cancelled
  # takes an earlier success back.
  checks-status:
    name: Mark the commits' checks
    needs: [release-please, check, app-check]
    if: ${{ always() && needs.check.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.result }}
          APP_APART: ${{ needs.release-please.outputs.app-apart }}
          APP_SHA: ${{ needs.release-please.outputs.app-sha }}
          APP_RESULT: ${{ needs.app-check.result }}
        run: |
          mark() {
            case $2 in
              success) state=success description="Every check passed on main." ;;
              failure) state=failure description="A check failed on main." ;;
              *) state=error description="Main's checks didn't finish ($2)." ;;
            esac
            gh api "repos/$GITHUB_REPOSITORY/statuses/$1" \
              -f state="$state" -f context=Checks \
              -f description="$description" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
            echo "Marked $1: $description"
          }
          mark "$GITHUB_SHA" "$RESULT"
          if [ "$APP_APART" = true ]; then
            mark "$APP_SHA" "$APP_RESULT"
          fi
      - name: Note that nothing ships
        if: github.actor != 'AliOsm'
        env:
          ACTOR: ${{ github.actor }}
          RESULT: ${{ needs.check.result }}
          APP: ${{ needs.release-please.outputs.app }}
          APP_APART: ${{ needs.release-please.outputs.app-apart }}
          APP_RESULT: ${{ needs.app-check.result }}
          TAG: ${{ needs.release-please.outputs.app-tag }}
        run: |
          if [ "$RESULT" = success ]; then
            echo "::notice::$ACTOR started this run, so it doesn't deploy $GITHUB_SHA: the vault serves the deploy token only in runs AliOsm started. AliOsm can run Release web on main to deploy main's newest commit."
          fi
          # The app's commit's checks: this run's, or its own.
          app_result=$RESULT
          if [ "$APP_APART" = true ]; then
            app_result=$APP_RESULT
          fi
          if [ "$APP" = true ] && [ "$app_result" = success ]; then
            echo "::notice::$ACTOR started this run, so it doesn't release $TAG: the vault serves the release secrets only in runs AliOsm started. AliOsm can run Release app on $TAG with dry-run unticked."
          fi

  web:
    name: Release web
    needs: check
    if: github.actor == 'AliOsm'
    permissions:
      contents: read
      id-token: write
      statuses: read
    uses: ./.github/workflows/web.yml
    with:
      sha: ${{ github.sha }}

  # From the commit release-please tagged, once that commit's own checks
  # passed: this run's, or the app's commit's when it's an earlier one.
  app:
    name: Release app
    needs: [release-please, check, app-check]
    if: >-
      ${{ !cancelled() && github.actor == 'AliOsm' && needs.release-please.outputs.app == 'true' &&
      ((needs.release-please.outputs.app-apart == 'true' && needs.app-check.result == 'success') ||
      (needs.release-please.outputs.app-apart != 'true' && needs.check.result == 'success')) }}
    permissions:
      contents: read
      id-token: write
      statuses: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.app-tag }}
      sha: ${{ needs.release-please.outputs.app-sha }}

  # The vault access checks, run by hand on main (see the top).
  access-check-app:
    name: Vault access check (app)
    if: github.ref == 'refs/heads/main' && inputs.access-check
    permissions:
      contents: read
      id-token: write
      statuses: read
    uses: ./.github/workflows/release.yml
    with:
      access-check: true

  access-check-web:
    name: Vault access check (web)
    if: github.ref == 'refs/heads/main' && inputs.access-check
    permissions:
      contents: read
      id-token: write
      statuses: read
    uses: ./.github/workflows/web.yml
    with:
      access-check: true
